apiVersion: v1
kind: Pod
metadata:
  name: pod1
  labels:
    app: openperouter
    component: workload-test
  annotations:
    cpu-quota.crio.io: "disable"
#    cpu-load-balancing.crio.io: "disable"
#    irq-load-balancing.crio.io: "disable"
spec:
  priorityClassName: system-node-critical
  runtimeClassName: performance-grout-performance
  terminationGracePeriodSeconds: 10
  hostPID: true
  containers:
  - name: datapath-shape
    image: quay.io/redhat-user-workloads/telco-5g-tenant/openperouter-operator-edge-5-0:on-pr-0e81b6c4ce9fea975946e2c6ad6e3f6f8dbf96d4
    command: ["/bin/bash", "-xc"]
    args:
    - |
      # Read the exclusive CPUs assigned to this container by kubelet.
      # In a privileged container, /sys/fs/cgroup/cpuset.cpus.effective
      # reflects the parent cgroup (all host CPUs). Read from the
      # container's own cgroup path to get the guaranteed CPUs.
      date
      CGROUP=$(cat /proc/self/cgroup | cut -d: -f3)
      CPUSET=$(cat /sys/fs/cgroup"$CGROUP"/cpuset.cpus)
      
      nsenter -t 1 -m -u -p -- \
        systemctl --runtime set-property container1.slice AllowedCPUs="$CPUSET"

      CONTAINER="container1"
      HOST_PIDS=$(nsenter -t 1 -m -u -p -- \
        podman top "$CONTAINER" hpid | tail -n +2)

      for PID in $HOST_PIDS; do
        echo "Applying taskset to Host PID: $PID"
        # -a applies to all threads, -p operates on an existing PID, -c specifies CPU list
        if ! taskset -a -p -c "$CPUSET" "$PID" >/dev/null; then
            echo "Failed to set affinity for PID $PID (Requires root/sudo?)"
        fi
      done

      exec sleep infinity
      
    securityContext:
      privileged: true
    resources:
      requests:
        cpu: "2"
        memory: "1Gi"
        hugepages-1Gi: "1Gi"
      limits:
        cpu: "2"
        memory: "1Gi"
        hugepages-1Gi: "1Gi"
    volumeMounts:
    - name: hugepages
      mountPath: /dev/hugepages
    - name: shared-data
      mountPath: /shared
  volumes:
  - name: shared-data
    emptyDir: {}
  - name: hugepages
    emptyDir:
      medium: HugePages-1Gi
